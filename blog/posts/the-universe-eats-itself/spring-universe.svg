<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Two energy curves: a normal spring whose energy rises with displacement, and a broken universe where energy falls.">
  <defs>
    <marker id="rah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#b4232a"/></marker>
    <marker id="gah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#1a7f4b"/></marker>
  </defs>
  <rect x="0" y="0" width="820" height="380" fill="#ffffff"/>
  <line x1="410" y1="24" x2="410" y2="356" stroke="#e6e6e6" stroke-width="1.5" stroke-dasharray="3 6"/>

  <!-- LEFT: our universe -->
  <text x="44" y="40" font-size="16" font-weight="700" fill="#262730">Our universe</text>
  <text x="44" y="60" font-size="12.5" fill="#6B7280">stretch or squeeze &#8594; energy climbs, so the spring springs back</text>
  <path d="M64,92 V308 H372" fill="none" stroke="#9aa3b2" stroke-width="1.5"/>
  <text x="52" y="98" font-size="11" fill="#9aa3b2" text-anchor="end">U</text>
  <text x="378" y="322" font-size="11" fill="#9aa3b2">displacement</text>
  <path d="M74,112 Q214,486 354,112" fill="none" stroke="#1a7f4b" stroke-width="3.5"/>
  <circle cx="214" cy="294" r="4.5" fill="#1a7f4b"/>
  <text x="214" y="132" font-size="12.5" font-weight="700" fill="#1a7f4b" text-anchor="middle">U = &#189;k&#8201;x&#178;</text>
  <!-- roll-in arrows: ball slides down both flanks toward the stable rest -->
  <path d="M150,255 l24,26" fill="none" stroke="#1a7f4b" stroke-width="2" marker-end="url(#gah)"/>
  <path d="M278,255 l-24,26" fill="none" stroke="#1a7f4b" stroke-width="2" marker-end="url(#gah)"/>
  <text x="214" y="316" font-size="12" font-weight="700" fill="#1a7f4b" text-anchor="middle">stable rest &#8595;</text>

  <!-- RIGHT: broken universe -->
  <text x="454" y="40" font-size="16" font-weight="700" fill="#262730">The flipped universe</text>
  <text x="454" y="60" font-size="12.5" fill="#6B7280">stretch or squeeze &#8594; energy falls away, so everything flies apart</text>
  <path d="M474,92 V308 H782" fill="none" stroke="#9aa3b2" stroke-width="1.5"/>
  <text x="462" y="98" font-size="11" fill="#9aa3b2" text-anchor="end">U</text>
  <text x="788" y="322" font-size="11" fill="#9aa3b2">displacement</text>
  <!-- true 1/x^2 spike: energy blows up at rest, decays to zero on both sides -->
  <path d="M484,300 C574,300 606,288 624,116 C642,288 674,300 764,300" fill="none" stroke="#b4232a" stroke-width="3.5"/>
  <circle cx="624" cy="120" r="4.5" fill="#b4232a"/>
  <text x="624" y="104" font-size="12.5" font-weight="700" fill="#b4232a" text-anchor="middle">U = &#189;k&#8201;/&#8201;x&#178;</text>
  <!-- flee arrows: ball rolls off the spike, slightly tilted outward and down -->
  <path d="M566,289 l-34,9" fill="none" stroke="#b4232a" stroke-width="2" marker-end="url(#rah)"/>
  <path d="M682,289 l34,9" fill="none" stroke="#b4232a" stroke-width="2" marker-end="url(#rah)"/>
  <text x="624" y="300" font-size="12" font-weight="700" fill="#b4232a" text-anchor="middle">rest is a hilltop &#8593;</text>
</svg>
